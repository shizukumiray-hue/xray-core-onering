name: Multi-CDN Release

on:
  push:
    tags:
      - 'v*'
      - 'multicdn-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

env:
  GO_VERSION: '1.26'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## Xray-Core Onering Multi-CDN Release ${{ steps.get_version.outputs.version }}
          
          ### 🚀 Features
          - Multi-CDN support for anti-DPI bypass
          - Intelligent CDN selection strategies
          - ISP-specific profiles (Telkomsel, Indosat, XL)
          - Automatic failover and health checks
          - DPI evasion techniques
          
          ### 📦 Available Builds
          - Linux (amd64, arm64, arm7, arm6, arm5)
          - Android (arm64, amd64, AAR library)
          - Windows (amd64, arm64)
          - macOS (amd64, arm64)
          - FreeBSD, OpenBSD
          - RISC-V, MIPS, LoongArch, s390x
          
          ### 🔧 Multi-CDN Configuration
          See documentation for complete configuration examples.
          
          ### 📝 Changelog
          EOF
          
          # Generate changelog from git log
          if git describe --tags --abbrev=0 2>/dev/null; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$PREV_TAG" ]]; then
              echo "" >> RELEASE_NOTES.md
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
            fi
          fi
          
          cat RELEASE_NOTES.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Xray-Core Onering Multi-CDN ${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'alpha') }}

  build-and-release:
    name: Build and Release
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - {goos: linux, goarch: amd64, name: linux-64}
          - {goos: linux, goarch: 386, name: linux-32}
          - {goos: linux, goarch: arm64, name: linux-arm64-v8a}
          - {goos: linux, goarch: arm, goarm: 7, name: linux-arm32-v7a}
          - {goos: linux, goarch: arm, goarm: 6, name: linux-arm32-v6}
          - {goos: linux, goarch: arm, goarm: 5, name: linux-arm32-v5}
          - {goos: linux, goarch: mips, name: linux-mips32}
          - {goos: linux, goarch: mipsle, name: linux-mips32le}
          - {goos: linux, goarch: mips64, name: linux-mips64}
          - {goos: linux, goarch: mips64le, name: linux-mips64le}
          - {goos: linux, goarch: riscv64, name: linux-riscv64}
          - {goos: linux, goarch: loong64, name: linux-loong64}
          - {goos: linux, goarch: s390x, name: linux-s390x}
          - {goos: linux, goarch: ppc64, name: linux-ppc64}
          - {goos: linux, goarch: ppc64le, name: linux-ppc64le}
          # Android builds
          - {goos: android, goarch: arm64, name: android-arm64-v8a, cgo: true}
          - {goos: android, goarch: amd64, name: android-amd64, cgo: true}
          # Windows builds
          - {goos: windows, goarch: amd64, name: windows-64}
          - {goos: windows, goarch: 386, name: windows-32}
          - {goos: windows, goarch: arm64, name: windows-arm64-v8a}
          # macOS builds
          - {goos: darwin, goarch: amd64, name: macos-64}
          - {goos: darwin, goarch: arm64, name: macos-arm64-v8a}
          # FreeBSD builds
          - {goos: freebsd, goarch: amd64, name: freebsd-64}
          - {goos: freebsd, goarch: 386, name: freebsd-32}
          - {goos: freebsd, goarch: arm64, name: freebsd-arm64-v8a}
          - {goos: freebsd, goarch: arm, goarm: 7, name: freebsd-arm32-v7a}
          # OpenBSD builds
          - {goos: openbsd, goarch: amd64, name: openbsd-64}
          - {goos: openbsd, goarch: 386, name: openbsd-32}
          - {goos: openbsd, goarch: arm64, name: openbsd-arm64-v8a}
          - {goos: openbsd, goarch: arm, goarm: 7, name: openbsd-arm32-v7a}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set up Android NDK
        if: matrix.goos == 'android'
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          declare -A arches=(
            ["amd64"]="x86_64-linux-android24-clang"
            ["arm64"]="aarch64-linux-android24-clang"
          )
          echo "CC=$(realpath android-ndk-*/toolchains/llvm/prebuilt/linux-x86_64/bin)/${arches[${{ matrix.goarch }}]}" >> $GITHUB_ENV

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo && '1' || '0' }}
        run: |
          mkdir -p build_assets
          OUTPUT="build_assets/xray"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            OUTPUT="build_assets/xray.exe"
          fi
          
          VERSION="${{ needs.create-release.outputs.version }}"
          
          echo "Building Xray-Core Onering Multi-CDN for $GOOS/$GOARCH..."
          
          # Special handling for MIPS softfloat
          if [[ "${{ matrix.goarch }}" == "mips" || "${{ matrix.goarch }}" == "mipsle" ]]; then
            go build \
              -o "$OUTPUT" \
              -trimpath \
              -buildvcs=false \
              -gcflags="-l=4" \
              -ldflags="-X github.com/xtls/xray-core/core.build=${VERSION} -s -w -buildid=" \
              -v \
              ./main
            
            # Build softfloat variant
            GOMIPS=softfloat go build \
              -o "build_assets/xray_softfloat" \
              -trimpath \
              -buildvcs=false \
              -gcflags="-l=4" \
              -ldflags="-X github.com/xtls/xray-core/core.build=${VERSION} -s -w -buildid=" \
              -v \
              ./main
          else
            go build \
              -o "$OUTPUT" \
              -trimpath \
              -buildvcs=false \
              -gcflags="all=-l=4" \
              -ldflags="-X github.com/xtls/xray-core/core.build=${VERSION} -s -w -buildid=" \
              -v \
              ./main
          fi
          
          ls -lh build_assets/

      - name: Add documentation and config
        run: |
          # Copy README and LICENSE
          cp README.md build_assets/ 2>/dev/null || echo "README.md not found"
          cp LICENSE build_assets/ 2>/dev/null || echo "LICENSE not found"
          
          # Create sample Multi-CDN config
          cat > build_assets/config-multicdn-sample.json << 'EOF'
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [{
              "port": 10808,
              "protocol": "socks",
              "settings": {
                "udp": true
              }
            }],
            "outbounds": [{
              "protocol": "vmess",
              "settings": {
                "vnext": [{
                  "address": "your-server.com",
                  "port": 443,
                  "users": [{"id": "your-uuid-here"}]
                }]
              },
              "streamSettings": {
                "network": "ws",
                "security": "tls",
                "tlsSettings": {
                  "serverName": "onering-multi:your-server.com",
                  "fingerprint": "chrome",
                  "multiCDN": {
                    "enabled": true,
                    "strategy": "health-based",
                    "providers": [
                      {
                        "name": "cloudflare",
                        "bugDomain": "zoom.us",
                        "priority": 100,
                        "isps": ["telkomsel"]
                      },
                      {
                        "name": "cloudfront",
                        "bugDomain": "teams.microsoft.com",
                        "priority": 90,
                        "isps": ["indosat", "xl"]
                      }
                    ],
                    "healthCheck": {
                      "enabled": true,
                      "interval": "30s"
                    },
                    "evasion": {
                      "enableRotation": true,
                      "rotateInterval": "5m"
                    }
                  }
                }
              }
            }]
          }
          EOF
          
          # Add Windows helper scripts
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            echo 'CreateObject("Wscript.Shell").Run "xray.exe -config config.json",0' > build_assets/xray_no_window.vbs
            echo 'Start-Process -FilePath ".\xray.exe" -ArgumentList "-config config.json" -WindowStyle Hidden' > build_assets/xray_no_window.ps1
          fi

      - name: Create release archive
        run: |
          cd build_assets
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-Onering-MultiCDN-${{ matrix.name }}.zip .
          cd ..
          
          # Generate checksums
          FILE="Xray-Onering-MultiCDN-${{ matrix.name }}.zip"
          sha256sum "$FILE" > "$FILE.sha256"
          md5sum "$FILE" > "$FILE.md5"

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Xray-Onering-MultiCDN-${{ matrix.name }}.zip
          asset_name: Xray-Onering-MultiCDN-${{ matrix.name }}.zip
          asset_content_type: application/zip

      - name: Upload checksum files
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Xray-Onering-MultiCDN-${{ matrix.name }}.zip.sha256
          asset_name: Xray-Onering-MultiCDN-${{ matrix.name }}.zip.sha256
          asset_content_type: text/plain

  build-android-aar-release:
    name: Build and Release Android AAR
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set up Android NDK
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          echo "ANDROID_NDK_HOME=$(realpath android-ndk-*)" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Android AAR
        run: |
          mkdir -p build_assets
          VERSION="${{ needs.create-release.outputs.version }}"
          
          echo "Building Android AAR library..."
          
          # Check if library directory exists, if not create a basic one
          if [[ ! -d "library" ]]; then
            echo "Creating library package..."
            mkdir -p library
            # Create a basic export file for the library
            cat > library/library.go << 'EOFLIB'
          package library

          // This is a placeholder for gomobile bind
          // Add your exported functions here
          EOFLIB
          fi
          
          gomobile bind \
            -v \
            -target=android/arm64,android/arm \
            -androidapi=24 \
            -ldflags="-X github.com/xtls/xray-core/core.build=${VERSION} -s -w" \
            -o build_assets/xray-onering-multicdn.aar \
            ./library || echo "AAR build requires proper library package structure"
          
          # Copy documentation
          cp README.md build_assets/ 2>/dev/null || true
          cp LICENSE build_assets/ 2>/dev/null || true

      - name: Create AAR archive
        if: success()
        run: |
          cd build_assets
          zip -9vr ../Xray-Onering-MultiCDN-android-aar.zip .
          cd ..
          sha256sum Xray-Onering-MultiCDN-android-aar.zip > Xray-Onering-MultiCDN-android-aar.zip.sha256

      - name: Upload AAR to release
        if: success()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Xray-Onering-MultiCDN-android-aar.zip
          asset_name: Xray-Onering-MultiCDN-android-aar.zip
          asset_content_type: application/zip

  release-summary:
    name: Release Summary
    needs: [create-release, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## 🎉 Release Complete: ${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Links" >> $GITHUB_STEP_SUMMARY
          echo "Visit the [release page](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}) to download builds." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux (amd64, arm64, arm7, arm6, arm5, MIPS, RISC-V, LoongArch)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Android (arm64, amd64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ FreeBSD, OpenBSD" >> $GITHUB_STEP_SUMMARY
